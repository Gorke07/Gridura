name: Gridura
options:
  bundleIdPrefix: app.gridura
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ONLY_ACTIVE_ARCH: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    GCC_OPTIMIZATION_LEVEL: "0"
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Release:
      # The base values above are debug-friendly; a shipped build is optimised, universal and has no debug dylib.
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
      ONLY_ACTIVE_ARCH: NO
      ENABLE_DEBUG_DYLIB: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  Gridura:
    type: application
    platform: macOS
    sources:
      - path: Gridura
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Gridura
        PRODUCT_BUNDLE_IDENTIFIER: app.gridura.Gridura
        INFOPLIST_FILE: Gridura/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Notarization rejects com.apple.security.get-task-allow, which Xcode injects by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: Gridura/Resources/Info.plist
      properties:
        CFBundleName: Gridura
        CFBundleDisplayName: Gridura
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - tr
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: "Copyright © 2026 Gorke07. Released under the MIT License."
        # Sparkle: the appcast lists releases; updates must be signed with the EdDSA key matching SUPublicEDKey
        # (private key in the release Mac's login keychain, account "gridura"; see docs/release.md).
        SUFeedURL: https://raw.githubusercontent.com/Gorke07/Gridura/main/appcast.xml
        SUPublicEDKey: FNzjMTd1J1vTLewx4mqMS8RQpGJnit3gFPHUCkIhPAs=
        CFBundleDocumentTypes:
          - CFBundleTypeName: Gridura Backup File
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.gridura.Gridura.backup
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.gridura.Gridura.backup
            UTTypeDescription: Gridura Backup File
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - gridura
    entitlements:
      path: Gridura/Resources/Gridura.entitlements
      properties: {}
